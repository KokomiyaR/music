<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drive Player">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2030">
<title>Drive Player</title>
<style>
:root{--bg:#1b2030;--sf:#262d42;--tx:#eef1f8;--mu:#97a0b8;--ac:#7cc4ff;--ln:#363e57}
@media(prefers-color-scheme:light){:root{--bg:#f2f4fa;--sf:#fff;--tx:#1b2030;--mu:#667090;--ac:#1a73c9;--ln:#d6dbe9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
nav{display:flex;border-bottom:1px solid var(--ln)}
nav button{flex:1;padding:12px 0;background:none;border:0;color:var(--mu);font:inherit;font-size:14px;border-bottom:3px solid transparent}
nav button.on{color:var(--ac);border-color:var(--ac)}
main{flex:1;overflow-y:auto;padding:12px 14px}
section{display:none}section.on{display:block}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}
.row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.cur .n{color:var(--ac);font-weight:600}
button.b,input[type=text]{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font:inherit}
button.b.p{background:var(--ac);color:#08111d;border-color:var(--ac);font-weight:600}
input[type=text]{width:100%}
.bar{display:flex;gap:8px;margin-bottom:10px}.bar input{flex:1}
.eq{display:flex;align-items:center;gap:10px;margin:14px 0}
.eq label{width:64px;font-size:13px;color:var(--mu)}.eq output{width:52px;text-align:right;font-size:13px}
input[type=range]{flex:1;accent-color:var(--ac)}
.hint{color:var(--mu);font-size:13px}
footer{background:var(--sf);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
#ti{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#st{font-size:12px;color:var(--mu);height:16px}
.ctl{display:flex;justify-content:center;gap:22px;margin-top:4px}
.ctl button{background:none;border:0;color:var(--tx);font-size:28px;padding:4px 10px}
.ctl #pp{color:var(--ac);font-size:34px}
.seek{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu)}
</style>
</head>
<body>
<nav id="nav">
<button data-t="files" class="on">ファイル</button><button data-t="queue">再生中</button><button data-t="lists">リスト</button><button data-t="eq">音質</button><button data-t="set">設定</button>
</nav>
<main>
<section id="files" class="on">
<div class="bar"><input type="text" id="q" placeholder="ファイル名で検索"><button class="b p" id="go">検索</button></div>
<div class="bar"><button class="b" id="up" style="display:none">← 戻る</button><button class="b" id="pa" style="display:none">▶ このフォルダを再生</button></div>
<div class="hint" id="bc"></div>
<div id="fl"><p class="hint">「設定」でクライアントIDを入れてログインすると、Googleドライブの音楽が表示されます。</p></div>
<button class="b" id="more" style="display:none;width:100%;margin-top:10px">さらに読み込む</button>
</section>
<section id="queue">
<div class="bar"><input type="text" id="pn" placeholder="リスト名"><button class="b p" id="sv">保存</button></div>
<div id="ql"></div>
</section>
<section id="lists"><div id="pl"></div></section>
<section id="eq">
<div class="eq"><label>音量</label><input type="range" id="pre" min="0" max="400" step="5"><output id="preo"></output></div>
<div id="bands"></div>
<div class="eq"><label>音割れ防止</label><input type="checkbox" id="lim"><span class="hint">音量を上げた時のクリップを抑えます</span></div>
<div class="bar" style="flex-wrap:wrap" id="presets"></div>
<p class="hint">音量は100%が原音です。200%以上にする場合は音割れ防止をオンにしてください。</p>
</section>
<section id="set">
<p>Google OAuth クライアントID</p>
<input type="text" id="cid" placeholder="xxxx.apps.googleusercontent.com" autocapitalize="off" autocorrect="off">
<div class="bar" style="margin-top:10px"><button class="b p" id="login">保存してログイン</button><button class="b" id="logout">ログアウト</button></div>
<p class="hint">ログインは約1時間で切れます。切れたら再生ボタンを押すと再ログインできます。</p>
</section>
</main>
<footer>
<div id="ti">曲を選んでください</div><div id="st"></div>
<div class="seek"><span id="cu">0:00</span><input type="range" id="sk" min="0" max="1000" value="0"><span id="du">0:00</span></div>
<div class="ctl"><button id="pv">⏮</button><button id="pp">▶</button><button id="nx">⏭</button></div>
</footer>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $=s=>document.querySelector(s);
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const toast=m=>{$('#st').textContent=m};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';

// ---------- tabs ----------
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;
 document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));
 e.target.classList.add('on');$('#'+t).classList.add('on')};

// ---------- auth ----------
let clientId=LS('cid',''),tc=null,wait=null;
let tok=LS('tok',{t:null,e:0});
$('#cid').value=clientId;
function initAuth(){
 if(!clientId||!window.google||!google.accounts)return false;
 tc=google.accounts.oauth2.initTokenClient({client_id:clientId,scope:'https://www.googleapis.com/auth/drive.readonly',
  callback:r=>{if(r.access_token){tok={t:r.access_token,e:Date.now()+r.expires_in*1000-60000};SV('tok',tok);toast('ログインしました');wait&&wait(true);}
   else{toast('ログインに失敗しました');wait&&wait(false)}wait=null}});
 return true}
function ensureToken(){
 return new Promise(res=>{
  if(tok.t&&Date.now()<tok.e)return res(true);
  if(!tc&&!initAuth()){toast('設定でクライアントIDを入力してください');return res(false)}
  wait=res;tc.requestAccessToken({prompt:''})})}
async function api(url,retry=true){
 if(!await ensureToken())throw new Error('auth');
 const r=await fetch(url,{headers:{Authorization:'Bearer '+tok.t}});
 if(r.status===401&&retry){tok={t:null,e:0};return api(url,false)}
 if(!r.ok)throw new Error('HTTP '+r.status);return r}
$('#login').onclick=async()=>{clientId=$('#cid').value.trim();SV('cid',clientId);tc=null;tok={t:null,e:0};
 if(await ensureToken()){document.querySelector('[data-t=files]').click();loadFiles()}};
$('#logout').onclick=()=>{if(tok.t&&window.google)google.accounts.oauth2.revoke(tok.t);tok={t:null,e:0};SV('tok',tok);toast('ログアウトしました')};

// ---------- drive browse ----------
const FOLDER='application/vnd.google-apps.folder';
let files=[],nextTok=null,path=[{id:'root',name:'マイドライブ'}],searching=false;
async function loadFiles(more){
 try{
  const s=$('#q').value.trim().replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  searching=!!s;
  const q=s?`mimeType contains 'audio/' and trashed=false and name contains '${s}'`
   :`'${path[path.length-1].id}' in parents and trashed=false and (mimeType='${FOLDER}' or mimeType contains 'audio/')`;
  const p=new URLSearchParams({q,pageSize:100,orderBy:'folder,name',fields:'nextPageToken,files(id,name,mimeType)'});
  if(more&&nextTok)p.set('pageToken',nextTok);
  toast('読み込み中…');
  const d=await(await api('https://www.googleapis.com/drive/v3/files?'+p)).json();
  files=more?files.concat(d.files):d.files;nextTok=d.nextPageToken||null;
  renderFiles();toast('')
 }catch(e){toast('読み込みエラー: '+e.message)}}
function renderFiles(){
 const box=$('#fl');box.textContent='';
 $('#bc').textContent=searching?'検索結果（全フォルダから）':path.map(x=>x.name).join(' / ');
 $('#up').style.display=(searching||path.length>1)?'':'none';
 const songs=files.filter(f=>f.mimeType!==FOLDER);
 $('#pa').style.display=songs.length?'':'none';
 $('#pa').onclick=()=>{queue=songs.slice();saveQ();renderQ();playAt(0)};
 if(!files.length)box.innerHTML='<p class="hint">このフォルダに音楽ファイルやフォルダはありません。</p>';
 files.forEach(f=>{
  const r=document.createElement('div');r.className='row';
  const n=document.createElement('span');n.className='n';
  if(f.mimeType===FOLDER){
   n.textContent='📁 '+f.name;
   n.onclick=()=>{path.push({id:f.id,name:f.name});$('#q').value='';nextTok=null;loadFiles()};
   r.append(n)
  }else{
   n.textContent=f.name;
   n.onclick=()=>{queue=songs.slice();saveQ();renderQ();playAt(songs.indexOf(f))};
   const a=document.createElement('button');a.className='b';a.textContent='＋';
   a.onclick=()=>{queue.push(f);saveQ();renderQ();toast('キューに追加しました')};
   r.append(n,a)}
  box.append(r)});
 $('#more').style.display=nextTok?'block':'none'}
$('#go').onclick=()=>{nextTok=null;loadFiles()};
$('#q').onkeydown=e=>{if(e.key==='Enter'){nextTok=null;loadFiles()}};
$('#up').onclick=()=>{if(searching)$('#q').value='';else path.pop();nextTok=null;loadFiles()};
$('#more').onclick=()=>loadFiles(true);

// ---------- audio engine ----------
const au=new Audio();au.preload='auto';au.setAttribute('playsinline','');
const BANDS=[[60,'lowshelf','60Hz'],[230,'peaking','230Hz'],[910,'peaking','910Hz'],[3600,'peaking','3.6kHz'],[14000,'highshelf','14kHz']];
const PRESETS={'フラット':[0,0,0,0,0],'低音強め':[7,4,0,-1,0],'ボーカル':[-2,0,3,4,1],'高音強め':[-1,0,0,4,7],'ラウド':[5,2,-1,3,5]};
let eqs=LS('eq',{g:[0,0,0,0,0],pre:100,lim:true});
let ctx=null,pre,filt=[],comp;
function setupAudio(){
 if(ctx)return;
 ctx=new(window.AudioContext||window.webkitAudioContext)();
 const src=ctx.createMediaElementSource(au);
 pre=ctx.createGain();comp=ctx.createDynamicsCompressor();
 comp.knee.value=6;comp.attack.value=0.003;comp.release.value=0.25;
 let node=src.connect(pre);
 BANDS.forEach(([f,t])=>{const b=ctx.createBiquadFilter();b.type=t;b.frequency.value=f;b.Q.value=1;filt.push(b);node=node.connect(b)});
 node.connect(comp).connect(ctx.destination);
 applyEq()}
function applyEq(){
 if(!ctx)return;
 pre.gain.value=eqs.pre/100;
 filt.forEach((b,i)=>b.gain.value=eqs.g[i]);
 comp.threshold.value=eqs.lim?-6:0;comp.ratio.value=eqs.lim?20:1}
function drawEq(){
 $('#pre').value=eqs.pre;$('#preo').textContent=eqs.pre+'%';$('#lim').checked=eqs.lim;
 const box=$('#bands');box.textContent='';
 BANDS.forEach(([,,l],i)=>{
  const d=document.createElement('div');d.className='eq';
  d.innerHTML=`<label>${l}</label><input type="range" min="-12" max="12" step="0.5"><output></output>`;
  const s=d.querySelector('input'),o=d.querySelector('output');
  s.value=eqs.g[i];o.textContent=eqs.g[i]+'dB';
  s.oninput=()=>{eqs.g[i]=+s.value;o.textContent=s.value+'dB';applyEq();SV('eq',eqs)};
  box.append(d)})}
$('#pre').oninput=e=>{eqs.pre=+e.target.value;$('#preo').textContent=eqs.pre+'%';applyEq();SV('eq',eqs)};
$('#lim').onchange=e=>{eqs.lim=e.target.checked;applyEq();SV('eq',eqs)};
Object.keys(PRESETS).forEach(k=>{const b=document.createElement('button');b.className='b';b.textContent=k;
 b.onclick=()=>{eqs.g=PRESETS[k].slice();drawEq();applyEq();SV('eq',eqs)};$('#presets').append(b)});
drawEq();

// ---------- queue / playback ----------
let queue=LS('queue',[]),cur=-1,seq=0,blobUrl=null;
function saveQ(){SV('queue',queue)}
function renderQ(){
 const box=$('#ql');box.textContent='';
 if(!queue.length)box.innerHTML='<p class="hint">キューは空です。ファイル画面で曲をタップするか「＋」で追加してください。</p>';
 queue.forEach((f,i)=>{
  const r=document.createElement('div');r.className='row'+(i===cur?' cur':'');
  const n=document.createElement('span');n.className='n';n.textContent=f.name;n.onclick=()=>playAt(i);
  const x=document.createElement('button');x.className='b';x.textContent='✕';
  x.onclick=()=>{queue.splice(i,1);if(i<cur)cur--;else if(i===cur)cur=-1;saveQ();renderQ()};
  r.append(n,x);box.append(r)})}
async function playAt(i){
 if(i<0||i>=queue.length)return;
 cur=i;const f=queue[i],my=++seq;
 renderQ();$('#ti').textContent=f.name;saveQ();
 setupAudio();ctx.resume();
 try{
  toast('ダウンロード中…');
  const r=await api(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`);
  const b=await r.blob();
  if(my!==seq)return;
  if(blobUrl)URL.revokeObjectURL(blobUrl);
  blobUrl=URL.createObjectURL(b);au.src=blobUrl;
  await au.play();toast('');setMedia(f)
 }catch(e){if(my===seq)toast('再生エラー: '+e.message)}}
function next(){if(cur+1<queue.length)playAt(cur+1);else toast('最後の曲です')}
function prev(){if(au.currentTime>3)au.currentTime=0;else if(cur>0)playAt(cur-1)}
function toggle(){
 if(!au.src){if(queue.length)playAt(Math.max(cur,0));return}
 setupAudio();ctx.resume();
 if(tok.t&&Date.now()<tok.e||au.src){au.paused?au.play():au.pause()}}
$('#pp').onclick=toggle;$('#nx').onclick=next;$('#pv').onclick=prev;
au.onplay=()=>{$('#pp').textContent='⏸'};au.onpause=()=>{$('#pp').textContent='▶'};
au.onended=next;
au.ontimeupdate=()=>{if(!seeking&&au.duration)$('#sk').value=au.currentTime/au.duration*1000;
 $('#cu').textContent=fmt(au.currentTime)};
au.onloadedmetadata=()=>{$('#du').textContent=fmt(au.duration)};
let seeking=false;const sk=$('#sk');
sk.oninput=()=>{seeking=true;if(au.duration)$('#cu').textContent=fmt(sk.value/1000*au.duration)};
sk.onchange=()=>{if(au.duration)au.currentTime=sk.value/1000*au.duration;seeking=false};
function setMedia(f){
 if(!('mediaSession' in navigator))return;
 navigator.mediaSession.metadata=new MediaMetadata({title:f.name.replace(/\.[^.]+$/,''),artist:'Drive Player'});
 const h=(a,fn)=>{try{navigator.mediaSession.setActionHandler(a,fn)}catch{}};
 h('play',()=>au.play());h('pause',()=>au.pause());h('nexttrack',next);h('previoustrack',prev);
 h('seekto',d=>{au.currentTime=d.seekTime})}

// ---------- playlists ----------
let lists=LS('lists',[]);
function renderLists(){
 const box=$('#pl');box.textContent='';
 if(!lists.length)box.innerHTML='<p class="hint">保存したリストはまだありません。「再生中」画面で名前を付けて保存できます。</p>';
 lists.forEach((l,i)=>{
  const r=document.createElement('div');r.className='row';
  const n=document.createElement('span');n.className='n';n.textContent=`${l.name}（${l.tracks.length}曲）`;
  n.onclick=()=>{queue=l.tracks.slice();saveQ();renderQ();document.querySelector('[data-t=queue]').click();playAt(0)};
  const x=document.createElement('button');x.className='b';x.textContent='削除';
  x.onclick=()=>{if(confirm(`「${l.name}」を削除しますか？`)){lists.splice(i,1);SV('lists',lists);renderLists()}};
  r.append(n,x);box.append(r)})}
$('#sv').onclick=()=>{
 const name=$('#pn').value.trim();
 if(!name)return toast('リスト名を入力してください');
 if(!queue.length)return toast('キューが空です');
 const ex=lists.find(l=>l.name===name);
 if(ex)ex.tracks=queue.slice();else lists.push({name,tracks:queue.slice()});
 SV('lists',lists);renderLists();$('#pn').value='';toast('リストを保存しました')};

renderQ();renderLists();
window.addEventListener('load',()=>{if(clientId&&tok.t&&Date.now()<tok.e)loadFiles()});
</script>
</body>
</html>
